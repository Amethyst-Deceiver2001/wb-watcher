[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-watch"
version = "0.1.0"
description = "Tracker for dual-use / military-coded goods on Wildberries.ru and linked Telegram crowdfunding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "telethon>=1.36",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "rich>=13.7",
    "typer>=0.12",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Only needed for `wb-watch crawl-ozon` (ozon/crawl.py) — a real Chromium
# session recording its own traffic as a HAR, since Ozon's bot wall blocks
# plain HTTP clients outright (see ozon/resolve.py, ozon/har_parse.py).
ozon-crawl = ["playwright>=1.45"]

[project.scripts]
wb-watch = "wb_watch.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["wb_watch*"]
